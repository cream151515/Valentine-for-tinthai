<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Tinthai ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffebee;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            transition: background-color 0.5s;
        }

        /* เอฟเฟกต์เขย่าหน้าจอ */
        .shake {
            animation: shake-animation 0.5s ease-in-out infinite;
        }

        @keyframes shake-animation {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-10px, 0); }
            50% { transform: translate(10px, 0); }
            75% { transform: translate(-10px, 0); }
            100% { transform: translate(0, 0); }
        }

        #card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        img {
            width: 250px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 { color: #d32f2f; margin: 10px 0; }
        p { font-size: 1.2rem; color: #555; }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px; /* เพิ่มระยะห่างระหว่างปุ่ม */
            margin-top: 30px;
            min-height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        #yesBtn { 
            background-color: #4caf50; 
            color: white; 
            z-index: 2;
        }

        #noBtn { 
            background-color: #f44336; 
            color: white; 
            position: relative; /* เปลี่ยนเป็น relative ก่อนเพื่อให้ไม่ซ้อน */
            z-index: 1;
        }

        /* หน้าดีใจ */
        #successPage {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .emoji-float {
            font-size: 50px;
            animation: float 1s infinite alternate;
        }

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div id="card">
        <img src="https://i.pinimg.com/736x/21/f1/81/21f181f253a66608973686259f9702951.jpg" alt="Cat with Flowers">
        <h1>Tinthai</h1>
        <p>Will you be my Valentine 🫦</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="showSuccess()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="successPage">
        <div class="emoji-float">😻💖✨</div>
        <h1 style="font-size: 3rem; color: #d32f2f;">Yee mak noob</h1>
        <h2 style="color: #555;">Best decision ever</h2>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZhcXF3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3Z3ZmJ5X2lkJmN0PWc/GeimqsH0TLDt4tScGw/giphy.gif" style="width: 300px;">
        <p style="font-weight: bold; font-size: 1.8rem; color: #ff4081; margin-top: 20px;">I love u baby</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed'; // เปลี่ยนเป็น fixed เมื่อเริ่มขยับหนี
            
            // คำนวณขอบเขตไม่ให้ปุ่มออกนอกจอ
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function showSuccess() {
            // ซ่อนหน้าแรก โชว์หน้าที่สอง
            document.getElementById('card').style.display = 'none';
            const successPage = document.getElementById('successPage');
            successPage.style.display = 'block';
            
            // เปลี่ยนพื้นหลังและเพิ่มเอฟเฟกต์สั่น
            document.body.style.backgroundColor = '#fce4ec';
            document.body.classList.add('shake');
            
            // หยุดสั่นหลังจาก 3 วินาที (เพื่อให้ดูตื่นเต้นแค่ตอนแรก)
            setTimeout(() => {
                document.body.classList.remove('shake');
            }, 3000);
            
            // พลุหัวใจ
            for(let i=0; i<60; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerText = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = Math.random() * 30 + 10 + 'px';
            heart.style.zIndex = '100';
            heart.style.pointerEvents = 'none';
            document.body.appendChild(heart);

            let top = -20;
            const speed = Math.random() * 3 + 2;
            const sideMovement = Math.random() * 2 - 1;
            let left = parseFloat(heart.style.left);

            const fall = setInterval(() => {
                top += speed;
                left += sideMovement;
                heart.style.top = top + 'px';
                heart.style.left = left + 'vw';
                
                if (top > window.innerHeight) {
                    clearInterval(fall);
                    heart.remove();
                }
            }, 20);
        }
    </script>
</body>
</html>
