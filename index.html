<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Tinthai ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffebee;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        img {
            width: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        h1 { color: #d32f2f; margin: 10px 0; }
        p { font-size: 1.2rem; color: #555; }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 10px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn { background-color: #4caf50; color: white; }
        #noBtn { 
            background-color: #f44336; 
            color: white; 
            position: absolute;
        }

        /* หน้าดีใจ */
        #successPage {
            display: none;
            text-align: center;
        }

        .confetti {
            font-size: 50px;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div id="card">
        <img src="https://i.pinimg.com/originals/60/91/92/60919253a656608973686259f9702951.jpg" alt="Cat with Flowers">
        <h1>Tinthai</h1>
        <p>Will you be my Valentine 🫦</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="showSuccess()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="successPage">
        <div class="confetti">🎉🥳🎊</div>
        <h1 style="font-size: 3rem;">Yee mak noob</h1>
        <h2>Best decision ever</h2>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXo3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/tsXUtMmgHrpS4S83ez/giphy.gif" style="width: 300px;">
        <p style="font-weight: bold; font-size: 1.5rem; color: #ff4081;">I love u baby</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // สุ่มตำแหน่งใหม่โดยไม่ให้กระโดดออกนอกจอ
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            noBtn.style.position = 'fixed';
        }

        function showSuccess() {
            document.getElementById('card').style.display = 'none';
            document.getElementById('successPage').style.display = 'block';
            document.body.style.backgroundColor = '#fce4ec';
            
            // เพิ่มเอฟเฟกต์พลุกระดาษแบบง่าย
            for(let i=0; i<50; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const colors = ['#ff4081', '#ffeb3b', '#2196f3', '#4caf50'];
            const div = document.createElement('div');
            div.innerText = '❤️';
            div.style.position = 'fixed';
            div.style.left = Math.random() * 100 + 'vw';
            div.style.top = '-10px';
            div.style.fontSize = Math.random() * 20 + 10 + 'px';
            div.style.color = colors[Math.floor(Math.random() * colors.length)];
            div.style.zIndex = '1';
            document.body.appendChild(div);

            let top = -10;
            setInterval(() => {
                top += 2;
                div.style.top = top + 'px';
            }, 10);
        }
    </script>
</body>
</html>
