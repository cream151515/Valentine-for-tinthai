<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Tinthai ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffebee;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            transition: background-color 0.5s;
        }

        .shake {
            animation: shake-animation 0.3s ease-in-out infinite;
        }

        @keyframes shake-animation {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-15px, 0); }
            50% { transform: translate(15px, 0); }
            75% { transform: translate(-15px, 0); }
            100% { transform: translate(0, 0); }
        }

        #card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        .main-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 { color: #d32f2f; margin: 10px 0; }
        p { font-size: 1.2rem; color: #555; }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; 
            margin-top: 30px;
            height: 60px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        #yesBtn { background-color: #4caf50; color: white; }
        #noBtn { background-color: #f44336; color: white; transition: all 0.1s ease; }

        #successPage {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .emoji-float {
            font-size: 50px;
            animation: float 0.8s infinite alternate;
        }

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div id="card">
        <img class="main-img" src="https://media.tenor.com/7968595562142750346/tenor.gif" alt="Happy Cat">
        <h1>Tinthai</h1>
        <p>Will you be my Valentine 🫦</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="showSuccess()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="successPage">
        <div class="emoji-float">😻💖✨</div>
        <h1 style="font-size: 2.5rem; color: #d32f2f;">Yee mak noob</h1>
        <h2 style="color: #555;">Best decision ever</h2>
        <img class="main-img" src="https://media.giphy.com/media/GeimqsH0TLDt4tScGw/giphy.gif">
        <p style="font-weight: bold; font-size: 1.8rem; color: #ff4081;">I love u baby</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function showSuccess() {
            document.getElementById('card').style.display = 'none';
            document.getElementById('successPage').style.display = 'block';
            document.body.style.backgroundColor = '#fce4ec';
            document.body.classList.add('shake');
            setTimeout(() => { document.body.classList.remove('shake'); }, 2500);
            setInterval(createHeart, 150);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerText = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            heart.style.zIndex = '100';
            document.body.appendChild(heart);
            let top = -20;
            const fall = setInterval(() => {
                top += 4;
                heart.style.top = top + 'px';
                if (top > window.innerHeight) { clearInterval(fall); heart.remove(); }
            }, 20);
        }
    </script>
</body>
</html>
